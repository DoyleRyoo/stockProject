<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome to Firebase Hosting</title>

    <script defer src="/__/firebase/12.13.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.13.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.13.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js?useEmulator=true"></script>

    <!-- bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <div class="container py-5">

    <!-- TITLE -->
    <div class="text-center mb-5">
      <h1 class="main-title">Doyle's Stock Chart</h1>
      <p class="sub-title">You can watch what Doyle's have</p>
    </div>

    <!-- INPUT TABLE -->
    <div class="card-box mb-5">

      <div class="table-responsive">

        <table class="table custom-table align-middle mb-0">

          <thead>
            <tr>
              <th>NAME</th>
              <th>PRICE</th>
              <th>AMOUNT</th>
              <th>RETURN (%)</th>
              <th>SAVE</th>
            </tr>
          </thead>

          <tbody>
            <tr>

              <td>
                <input
                  type="text"
                  class="form-control custom-input"
                  id="nameInput"
                  placeholder="Apple"
                />
              </td>

              <td>
                <input
                  type="number"
                  class="form-control custom-input"
                  id="priceInput"
                  placeholder="1000"
                />
              </td>

              <td>
                <input
                  type="number"
                  class="form-control custom-input"
                  id="amountInput"
                  placeholder="5"
                />
              </td>

              <td>
                <input
                  type="number"
                  class="form-control custom-input"
                  id="returnInput"
                  placeholder="15 or -12"
                />
              </td>

              <td>
                <button
                  class="btn save-btn"
                  id="saveBtn"
                >
                  SAVE
                </button>
              </td>

            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- STOCK TABLE -->
    <div class="card-box">

      <div class="table-responsive">

        <table class="table custom-table table-hover align-middle mb-0">

          <thead>
            <tr>
              <th>NAME</th>
              <th>PRICE</th>
              <th>AMOUNT</th>
              <th>RETURN</th>
              <th>SUM</th>
              <th></th>
            </tr>
          </thead>

          <tbody id="stockTableBody">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- EDIT MODAL -->
  <div
    class="modal fade"
    id="editModal"
    tabindex="-1"
  >
    <div class="modal-dialog">
      <div class="modal-content custom-modal">

        <div class="modal-header border-0">
          <h5 class="modal-title">Edit Stock</h5>

          <button
            type="button"
            class="btn-close btn-close-white"
            data-bs-dismiss="modal"
          ></button>
        </div>

        <div class="modal-body">

          <input type="hidden" id="editId" />

          <div class="mb-3">
            <label class="form-label">NAME</label>
            <input type="text" class="form-control custom-input" id="editName" />
          </div>

          <div class="mb-3">
            <label class="form-label">PRICE</label>
            <input type="number" class="form-control custom-input" id="editPrice" />
          </div>

          <div class="mb-3">
            <label class="form-label">AMOUNT</label>
            <input type="number" class="form-control custom-input" id="editAmount" />
          </div>

          <div class="mb-3">
            <label class="form-label">RETURN (%)</label>
            <input type="number" class="form-control custom-input" id="editReturn" />
          </div>

        </div>

        <div class="modal-footer border-0">

          <button
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>

          <button
            class="btn save-btn"
            id="updateBtn"
          >
            Update
          </button>

        </div>
      </div>
    </div>
  </div>

  <!-- DELETE MODAL -->
  <div
    class="modal fade"
    id="deleteModal"
    tabindex="-1"
  >
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content custom-modal">

        <div class="modal-header border-0">
          <h5 class="modal-title text-danger">
            Delete Confirmation
          </h5>
        </div>

        <div class="modal-body">
          진짜 삭제하시겠습니까?
        </div>

        <div class="modal-footer border-0">

          <button
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            취소
          </button>

          <button
            class="btn btn-danger"
            id="confirmDeleteBtn"
          >
            삭제
          </button>

        </div>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script type="module" src="app.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const loadEl = document.querySelector('#load');
        
        // firebase.auth().onAuthStateChanged(user => { });
        // firebase.firestore().doc('/foo/bar').get().then(() => { });

        try {
          let app = firebase.app();
          let db = firebase.firestore();

          let stocks = [];

          function renderStocks() {
            let tbody = [];
            db.collection("users").get().then((querySnapshot) => {
              querySnapshot.forEach((doc) => {
                stocks.push({
                  _id: doc.id,

                  <td>${stock.name}</td>

                  <td class="${sumClass}">

                  </td>

                  <td class="text-end">

                    <div class="dropdown">

                      <button
                        class="menu-btn"
                        data-bs-toggle="dropdown"
                      >
                        <i class="bi bi-three-dots-vertical"></i>
                      </button>

                      <ul class="dropdown-menu dropdown-menu-dark">

                        <li>

                          <button
                            class="dropdown-item"
                            onclick="openEditModal('${stock.id}')"
                          >
                            수정
                          </button>

                        </li>

                        <li>

                          <button
                            class="dropdown-item text-danger"
                            onclick="deleteStock('${stock.id}')"
                          >
                            삭제
                          </button>

                        </li>

                      </ul>

                    </div>

                  </td>

                `;
              });
            });
          }

        } catch (e) {
          console.error(e);
        }
      });
    </script>

  </body>
</html>
