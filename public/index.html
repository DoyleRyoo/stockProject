<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome to Firebase Hosting</title>

    <script defer src="/__/firebase/12.13.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.13.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.13.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js?useEmulator=true"></script>

    <!-- bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <div class="container py-5">

    <div class="main-card">

      <!-- HEADER -->
      <div class="text-center mb-5">
        <h1 class="title">Doyle's Stock Chart</h1>
        <p class="subtitle">You can watch what Doyle's have</p>
      </div>

      <!-- ADD BUTTON -->
      <div class="d-flex justify-content-end mb-4">
        <button class="btn btn-dark px-4 py-2" data-bs-toggle="modal" data-bs-target="#addModal">
          새 종목 추가
        </button>
      </div>

      <!-- TABLE -->
      <div class="table-responsive">
        <table class="table align-middle text-center">
          <thead class="table-dark">
            <tr>
              <th>NAME</th>
              <th>PRICE</th>
              <th>AMOUNT</th>
              <th>RETURN</th>
              <th>SUM</th>
              <th></th>
            </tr>
          </thead>

          <tbody id="stockTableBody"></tbody>

        </table>
      </div>
    </div>
  </div>

  <!-- ========================= -->
  <!-- ADD MODAL -->
  <!-- ========================= -->

  <div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header border-0">
          <h5 class="modal-title">새 종목 구매</h5>

          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <form id="addForm">

            <!-- NAME -->
            <div class="mb-3">
              <label class="form-label">NAME</label>

              <input type="text" class="form-control" id="addName"/>

              <div class="invalid-feedback">
                종목 이름을 입력해주세요.
              </div>
            </div>

            <!-- PRICE -->
            <div class="mb-3">
              <label class="form-label">PRICE</label>

              <input type="number" class="form-control" id="addPrice"/>

              <div class="invalid-feedback">
                0 이상의 가격을 입력해주세요.
              </div>
            </div>

            <!-- AMOUNT -->
            <div class="mb-3">
              <label class="form-label">AMOUNT</label>

              <input type="number" class="form-control" id="addAmount"/>

              <div class="invalid-feedback">
                수량은 1 이상이어야 합니다.
              </div>
            </div>

            <!-- RETURN -->
            <div class="mb-3">
              <label class="form-label">RETURN (%)</label>

              <input type="number" step="0.01" class="form-control" id="addReturn"/>

              <div class="invalid-feedback">
                수익률을 입력해주세요.
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer border-0">

          <button class="btn btn-secondary" data-bs-dismiss="modal">
            취소
          </button>

          <button class="btn btn-dark" id="saveAddBtn">
            저장
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ========================= -->
  <!-- EDIT MODAL -->
  <!-- ========================= -->

  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header border-0">
          <h5 class="modal-title">종목 수정</h5>

          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

        </div>

        <div class="modal-body">
          <form id="editForm">
            <input type="hidden" id="editId" />

            <!-- NAME -->
            <div class="mb-3">
              <label class="form-label">NAME</label>

              <input type="text" class="form-control" id="editName"/>

              <div class="invalid-feedback">
                종목 이름을 입력해주세요.
              </div>
            </div>

            <!-- PRICE -->
            <div class="mb-3">
              <label class="form-label">PRICE</label>

              <input type="number" class="form-control" id="editPrice"/>

              <div class="invalid-feedback">
                0 이상의 가격을 입력해주세요.
              </div>
            </div>

            <!-- AMOUNT -->
            <div class="mb-3">
              <label class="form-label">AMOUNT</label>

              <input type="number" class="form-control" id="editAmount"/>

              <div class="invalid-feedback">
                수량은 1 이상이어야 합니다.
              </div>
            </div>

            <!-- RETURN -->
            <div class="mb-3">
              <label class="form-label">RETURN (%)</label>

              <input type="number" step="0.01" class="form-control" id="editReturn"/>

              <div class="invalid-feedback">
                수익률을 입력해주세요.
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer border-0">

          <button class="btn btn-secondary" data-bs-dismiss="modal">
            취소
          </button>

          <button class="btn btn-dark" id="saveEditBtn">
            수정
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ========================= -->
  <!-- DELETE MODAL -->
  <!-- ========================= -->

  <div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center p-5">
          <h4 class="mb-3">정말 삭제하시겠습니까?</h4>

          <p class="text-secondary">
            삭제 후에는 복구할 수 없습니다.
          </p>

          <div class="d-flex justify-content-center gap-3 mt-4">

            <button class="btn btn-secondary px-4" data-bs-dismiss="modal">
              취소
            </button>

            <button class="btn btn-danger px-4" id="confirmDeleteBtn">
              삭제
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script type="module" src="app.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const loadEl = document.querySelector('#load');
        
        // firebase.auth().onAuthStateChanged(user => { });
        // firebase.firestore().doc('/foo/bar').get().then(() => { });

        try {
          let app = firebase.app();
          let db = firebase.firestore();

          let stocks = [];
          let deleteTargetId = null;

          const addModal = new bootstrap.Modal(document.getElementById("addModal"));

          const editModal = new bootstrap.Modal(document.getElementById("editModal"));

          const deleteModal = new bootstrap.Modal(document.getElementById("deleteModal"));

          function renderStocks() {
            let tbody = [];
            db.collection("users").get().then((querySnapshot) => {
              querySnapshot.forEach((doc) => {
                stocks.push({
                  _id: doc.id,
                  ...doc.data()
                });

                const sum = (stock.price * stock.amount) * (stock.returnRate / 100 + 1);

                // RETURN COLOR
                let returnClass = "neutral";

                if(stock.returnRate > 0) {
                  returnClass = "positive";
                } else if(stock.returnRate < 0) {
                  returnClass = "negative";
                }

                // SUM COLOR
                let sumClass = "sum-neutral";

                if(sum > stock.price * stock.amount) {
                  sumClass = "sum-profit";
                } else if(sum < stock.price * stock.amount) {
                  sumClass = "sum-loss";
                }

                tbody += `
                  <tr>
                    <td>${stock.name}</td>
                    <td>$${stock.price}</td>
                    <td>${stock.amount}</td>
                    <td class="${returnClass}">
                      ${stock.returnRate}%
                    </td>
                    <td class="${sumClass}">
                      $${sum.toFixed(2)}
                    </td>

                    <td>
                      <div class="dropdown">
                        <button
                          class="action-btn"
                          data-bs-toggle="dropdown"
                        >
                          ⋮
                        </button>

                        <ul
                          class="dropdown-menu dropdown-menu-end dropdown-menu-custom"
                        >
                          <li>
                            <button
                              class="dropdown-item"
                              onclick="window.openEditModal('${stock.id}')"
                            >
                              수정
                            </button>
                          </li>

                          <li>
                            <button
                              class="dropdown-item text-danger"
                              onclick="window.openDeleteModal('${stock.id}')"
                            >
                              삭제
                            </button>
                          </li>
                        </ul>
                      </div>
                    </td>
                  </tr>
                `;
              });
              document.getElementById("stockTableBody").innerHTML = tbody;
            });
          }

          function validateForm(prefix) {
            let isValid = true;
            const name = document.getElementById(`${prefix}Name`);
            const price = document.getElementById(`${prefix}Price`);
            const amount = document.getElementById(`${prefix}Amount`);
            const returnRate = document.getElementById(`${prefix}Return`);

            // RESET
            [name, price, amount, returnRate]
            .forEach(input => {
              input.classList.remove("is-invalid");
            });

            // NAME
            if(name.value.trim() === "") {
              name.classList.add("is-invalid");
              isValid = false;
            }

            // PRICE
            if(
              price.value === "" ||
              Number(price.value) < 0
            ) {
              price.classList.add("is-invalid");
              isValid = false;
            }

            // AMOUNT
            if(
              amount.value === "" ||
              Number(amount.value) < 1
            ) {
              amount.classList.add("is-invalid");
              isValid = false;
            }

            // RETURN
            if(returnRate.value === "") {
              returnRate.classList.add("is-invalid");
              isValid = false;
            }
            return isValid;
          }

          function addStock() {

          }

        } catch (e) {
          console.error(e);
        }
      });
    </script>

  </body>
</html>
